<div class="min-h-screen">
  <section class="container mx-auto w-full">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-gray-800">Order History</h1>
      <div class="">
        <span class="text-sm text-gray-400">
          Total orders: {{ (orders$ | async)?.orders?.length }}
        </span>
      </div>
    </div>
    <!-- <OrderHistoryList /> -->
  </section>

  <section>
    <div class="bg-white rounded-xl shadow-sm py-4 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="relative md:w-1/3">
          <input type="text" placeholder="Search by restaurant name..."
            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-green-100 focus:border-primary transition-al duration-300 text-sm placeholder:text-sm" />

          <div class="absolute top-1/2 left-3 -translate-y-[60%] h-5 w-5 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
        </div>

        <div class="flex flex-wrap gap-2">
          <div class="relative cursor-pointer">
            <select
              class="appearance-none pl-10 pr-8 py-2.5 bg-gray-50 border border-gray-200 rounded-md focus:outline-none focus:ring-0 focus:border-gray-200 text-sm  cursor-pointer">
              <option>All statuses</option>
              <option>Delivered</option>
              <option>In Delivery</option>
              <option>Cancelled</option>
            </select>
            <div class="absolute left-3 top-1/2 -translate-y-1/2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
              </svg>
            </div>
          </div>

          <div class="relative cursor-pointer  ">
            <select
              class="appearance-none pl-10 pr-8 py-2.5 bg-gray-50 border border-gray-200 rounded-md focus:outline-none focus:ring-0 focus:border-gray-200 text-sm  cursor-pointer">
              <option>All</option>
              <option>This month</option>
              <option>Last 3 months</option>
              <option>Last 6 months</option>
            </select>
            <div class="absolute left-3 top-1/2 -translate-y-1/2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-5">
      <app-order-history-list [orders]="(orders$ | async)?.orders ?? []"></app-order-history-list>

      <div [hidden]="!isNoData" class="text-center py-16 bg-white rounded-xl">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>

        </div>
        <h3 class="text-lg font-medium text-gray-800 mb-1">No orders yet</h3>
        <p class="text-gray-500 mb-4">You haven't placed any orders during this period</p>
        <a [routerLink]="['/']" class="px-4 py-2 bg-primary hover:text-white text-white rounded-lg transition-colors">
          Order now
        </a>
      </div>
    </div>
  </section>
</div>
