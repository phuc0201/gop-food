<div
  class="bg-white rounded-md shadow-sm overflow-hidden border border-gray-100 hover:shadow-md transition-shadow duration-300">
  <div class="p-5">
    <div class="flex items-start justify-between">
      <div class="flex">
        <div class="mr-4">
          <div class="relative">
            <img [src]="order.restaurant.cover_image" alt='avatar'
              class="h-14 w-14 rounded-xl object-cover border border-gray-100 shadow-sm" />
            <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center bg-white">
              <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
            </div>
          </div>
        </div>
        <div>
          <h3 class="font-semibold text-gray-900">
            {{order.restaurant.restaurant_name}}
          </h3>
          <div class="flex items-center mt-1 text-sm text-gray-500">
            <!-- <Clock class="h-3.5 w-3.5 mr-1" /> -->
            <span>
              <!-- {order.date} • {order.time} -->
              1/1/2025
            </span>
          </div>
          <div class="flex items-center mt-1">
            <div class="flex items-center px-2.5 py-1 gap-2 text-primary font-light rounded-full text-xs border">
              <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
              {{ 'Delivered' }}
            </div>
          </div>
        </div>
      </div>
      <div class="text-right">
        <p class="font-bold text-lg text-gray-900">100$</p>
        <p class="text-xs text-gray-500 mt-1">Order ID: #sdfgsdhf</p>
      </div>
    </div>

    <div class="mt-4 pt-4 border-t border-dashed border-gray-200 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center text-sm text-gray-500">
        <!-- <MapPin class="h-4 w-4 mr-1" /> -->
        <span>Delivered to: 123 ABC Street, District 1, HCMC</span>
      </div>
      <div class="flex space-x-2">
        <button
          class="flex items-center gap-2 px-3.5 py-2 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Reorder
        </button>
        <button (click)="showDetails = !showDetails"
          class="flex items-center px-3.5 py-2 bg-gray-50 border border-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">
          View details
        </button>
      </div>
    </div>
  </div>

  <div [hidden]="!showDetails" class="px-5 pb-5 bg-gray-50 border-t border-gray-100">
    <div class="py-3">
      <h4 class="text-sm font-medium text-gray-700 mb-3">
        Order details
      </h4>
      <ul class="space-y-3">
        <li key={index} class="flex justify-between text-sm bg-white p-3 rounded-lg border border-gray-100">
          <div class="flex items-center">
            <div class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center mr-2 text-xs font-medium">
              10
            </div>
            <span class="text-gray-800">name</span>
          </div>
          <span class="font-medium text-gray-900">100$</span>
        </li>
      </ul>

      <div class="mt-4 pt-3 border-t border-gray-200">
        <div class="flex justify-between text-sm text-gray-500 mb-2">
          <span>Subtotal</span>
          <span>$10.50</span>
        </div>
        <div class="flex justify-between text-sm text-gray-500 mb-2">
          <span>Delivery fee</span>
          <span>$1.50</span>
        </div>
        <div class="flex justify-between text-sm text-gray-500 mb-3">
          <span>Discount</span>
          <span>-$0</span>
        </div>
        <div class="flex justify-between font-semibold text-gray-900">
          <span>Total</span>
          <span>100$</span>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-200 flex justify-center">
        <button class="flex items-center text-sm gap-2 text-blue-600 hover:text-blue-700">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          View full receipt
        </button>
      </div>
    </div>
  </div>
</div>
