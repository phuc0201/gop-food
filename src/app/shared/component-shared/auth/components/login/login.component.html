<div class="w-full">
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <!-- Card Header -->
    <div class="p-6 border-b">
      <h2 class="text-2xl font-bold">Login</h2>
      <p class="text-sm text-gray-500">
        Login to your account
      </p>
    </div>

    <!-- Card Content -->
    <div class="p-6">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Form Error Message -->
        <div *ngIf="formError" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-md text-sm">
          {{ formError }}
        </div>

        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="name@example.com"
            class="w-full px-3 py-2 border rounded-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-green-200 md:placeholder:text-base placeholder:text-xs text-xs md:text-base"
            [ngClass]="{
              'border-red-500': (submitted || f['email'].touched) && f['email'].errors,
              'border-green-500': f['email'].valid && f['email'].touched
            }" (input)="onInputChange()" required />
          <div *ngIf="(submitted || f['email'].touched) && f['email'].errors" class="text-red-500 text-xs mt-1">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email'] || f['email'].errors['pattern']">Invalid email</span>
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-medium">Password</label>
            <a href="#" class="text-sm text-[#00b14f] hover:underline">
              Forgot password?
            </a>
          </div>
          <input id="password" type="password" formControlName="password"
            class="w-full px-3 py-2 border rounded-md focus:border-primary focus:outline-none focus:ring-2 focus:ring-green-200 md:placeholder:text-base placeholder:text-xs text-xs md:text-base"
            [ngClass]="{
              'border-red-500': (submitted || f['password'].touched) && f['password'].errors,
              'border-green-500': f['password'].valid && f['password'].touched
            }" (input)="onInputChange()" required />
          <div *ngIf="(submitted || f['password'].touched) && f['password'].errors" class="text-red-500 text-xs mt-1">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <button type="submit"
          class="w-full py-2 px-4 bg-[#00b14f] hover:bg-[#009a43] text-white rounded-md transition-colors"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            Processing...
          </span>
          <span *ngIf="!isLoading">Login</span>
        </button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">Or</span>
        </div>
      </div>

      <button type="button"
        class="w-full py-2 px-4 border border-gray-300 rounded-md flex items-center justify-center space-x-2 hover:bg-gray-50 transition-colors"
        (mousedown)="handleGoogleLogin()" [disabled]="isLoading">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 186.69 190.5">
          <g transform="translate(1184.583 765.171)">
            <path
              d="M-1089.333-687.239v36.888h51.262c-2.251 11.863-9.006 21.908-19.137 28.662l30.913 23.986c18.011-16.625 28.402-41.044 28.402-70.052 0-6.754-.606-13.249-1.732-19.483z"
              fill="#4285f4" />
            <path
              d="M-1142.714-651.791l-6.972 5.337-24.679 19.223h0c15.673 31.086 47.796 52.561 85.03 52.561 25.717 0 47.278-8.486 63.038-23.033l-30.913-23.986c-8.486 5.715-19.31 9.179-32.125 9.179-24.765 0-45.806-16.712-53.34-39.226z"
              fill="#34a853" />
            <path
              d="M-1174.365-712.61c-6.494 12.815-10.217 27.276-10.217 42.689s3.723 29.874 10.217 42.689c0 .086 31.693-24.592 31.693-24.592-1.905-5.715-3.031-11.776-3.031-18.098s1.126-12.383 3.031-18.098z"
              fill="#fbbc05" />
            <path
              d="M-1089.333-727.244c14.028 0 26.497 4.849 36.455 14.201l27.276-27.276c-16.539-15.413-38.013-24.852-63.731-24.852-37.234 0-69.359 21.388-85.032 52.561l31.692 24.592c7.533-22.514 28.575-39.226 53.34-39.226z"
              fill="#ea4335" />
          </g>
        </svg>
        <span>Login with Google</span>
      </button>
    </div>

    <!-- Card Footer -->
    <div class="p-6 border-t text-center">
      <p class="text-sm text-gray-500">
        Don't have an account?
        <button (mousedown)="switchToRegister.emit()" class="text-[#00b14f] hover:underline">
          Register
        </button>
      </p>
    </div>
  </div>
</div>
